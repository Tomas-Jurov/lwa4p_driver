# MoveIt controllers for the Isaac Sim backend. The arm and the execution settings are
# the real robot's (lwa4p_moveit_config/config/moveit_controllers.yaml; a test compares
# them). The gripper is a trajectory controller on gripper_joint, where the real robot
# has GripperCommand: Isaac Sim ships no gripper action controller, and the simulation
# gripper adapter is still open (decision D09).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [arm_1_joint, arm_2_joint, arm_3_joint, arm_4_joint, arm_5_joint, arm_6_joint]

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [gripper_joint]

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 3.0
  allowed_start_tolerance: 0.03
