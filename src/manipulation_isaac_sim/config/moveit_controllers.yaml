# MoveIt controllers for the Isaac Sim backend: the same controllers and execution
# settings as Tomas's Gazebo simulation (lwa4p_gazebo/config/moveit_controllers.yaml).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [arm_1_joint, arm_2_joint, arm_3_joint, arm_4_joint, arm_5_joint, arm_6_joint]

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [gripper_joint]

trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 3.0
  allowed_start_tolerance: 0.03
